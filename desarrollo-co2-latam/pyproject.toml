[project]
name = "desarrollo_co2"
version = "1.0.0"
description = "Desarrollo y emisiones en América Latina: desacople PIB–CO2, Kaya y curva de Kuznets (Banco Mundial + Our World in Data)"
authors = [{ name = "Erick Guarnizo" }]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::Warning"]
