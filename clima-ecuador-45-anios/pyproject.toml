[project]
name = "clima_ecuador"
version = "1.0.0"
description = "45 años de clima en Ecuador con ERA5: tendencias (Mann-Kendall + Sen), anomalías, extremos y El Niño"
authors = [{ name = "Erick Guarnizo" }]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
