name: CI

# Lint, documentation links and the test suite of the six projects.
# No dataset is downloaded: tests use the small samples and fixtures versioned in the repository.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and Markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install --disable-pip-version-check ruff==0.17.6
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Markdown links and language selectors
        run: python .github/scripts/check_markdown_links.py

  tests:
    name: ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - clima-ecuador-45-anios
          - delitos-chicago-analisis-espacial
          - desarrollo-co2-latam
          - mercado-laboral-ecuador-enemdu
          - nyc311-analisis-supervivencia
          - sismicidad-ecuador-usgs
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      # Notebooks are not executed in CI.
      - name: Install dependencies
        run: |
          grep -vE '^(jupyter|nbconvert)' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install --disable-pip-version-check -r "$RUNNER_TEMP/requirements-ci.txt" pytest
      - name: Tests
        run: python -m pytest -q -rs
